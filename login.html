<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121214"><title>登录 · 75.444</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="cloud.css"><meta name="application-name" content="75.444">
<meta name="apple-mobile-web-app-title" content="75.444">
</head><body><main><header><a href="index.html">← 首页</a><h1 id="pageTitle">登录</h1></header>
<p class="hint">邮箱注册，资料跨设备同步。旧的六位 ID 账号需重新注册。</p>
<form id="authForm">
 <label id="nicknameGroup" hidden>昵称<input id="nickname" maxlength="30" autocomplete="nickname"></label>
 <label id="emailGroup">邮箱<input id="email" type="email" autocomplete="email" required></label>
 <label id="passwordGroup">密码<input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label>
 <button class="primary" id="submitBtn" type="submit">登录</button>
 <nav><button type="button" data-mode="register">注册账号</button><button type="button" data-mode="login">返回登录</button><button type="button" data-mode="reset">忘记密码</button></nav>
</form>
<section id="account" hidden>
 <h2 id="userInfo"></h2><img id="avatarPreview" alt="头像">
 <label>头像（JPG / PNG / WebP，最多 2MB）<input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp"></label>
 <label>昵称<input id="nicknameEdit" maxlength="30"></label>
 <label>简介<textarea id="bio" maxlength="200"></textarea></label>
 <nav><button id="saveProfile" class="primary">保存资料</button><a href="community.html">进入社区</a><button id="logout">退出此设备</button></nav>
</section><p id="msg" role="status" aria-live="polite"></p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="cloud-config.js"></script><script src="cloud.js"></script><script src="account.js"></script></body></html>
